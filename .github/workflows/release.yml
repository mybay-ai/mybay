name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"
      - name: Run release quality gate
        run: npm run check
      - name: Create clean source archive
        run: |
          npm run release:create -- "release/mybay-$GITHUB_REF_NAME.zip"
          npm run release:check -- "release/mybay-$GITHUB_REF_NAME.zip"
          VERSION="${GITHUB_REF_NAME#v}"
          npm run release:create-windows -- "release/MyBay-Windows-v$VERSION.zip"
          npm run release:check-windows -- "release/MyBay-Windows-v$VERSION.zip"
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: "release/mybay-${{ github.ref_name }}.spdx.json"
          upload-artifact: false
          upload-release-assets: false
      - name: Generate checksums
        working-directory: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha256sum "mybay-$GITHUB_REF_NAME.zip" "MyBay-Windows-v$VERSION.zip" "mybay-$GITHUB_REF_NAME.spdx.json" > SHA256SUMS
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            release/mybay-${{ github.ref_name }}.zip
            release/MyBay-Windows-v*.zip
            release/mybay-${{ github.ref_name }}.spdx.json
            release/SHA256SUMS

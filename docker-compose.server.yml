services:
  mybay-local:
    networks:
      - default
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.mybay-console.rule=Host(`${CONTROL_PANEL_DOMAIN:?CONTROL_PANEL_DOMAIN is required}`)"
      - "traefik.http.routers.mybay-console.entrypoints=websecure"
      - "traefik.http.routers.mybay-console.tls=true"
      - "traefik.http.routers.mybay-console.tls.certresolver=letsencrypt"
      - "traefik.http.services.mybay-console.loadbalancer.server.port=${PORT:-3000}"

  traefik:
    image: traefik:v3.2
    container_name: traefik
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
      - "--providers.file.watch=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls.certresolver=letsencrypt"
      - "--certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL:?LETSENCRYPT_EMAIL is required}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - traefik_proxy
    restart: unless-stopped

networks:
  traefik_proxy:
    name: traefik_proxy

volumes:
  traefik_letsencrypt:

